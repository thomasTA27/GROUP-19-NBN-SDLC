packages:
  - 'frontend'
  - 'backend'

overrides:
  # firebase-functions pulls in @types/express@4 transitively, which conflicts
  # with our own @types/express@^5 (backend uses Express 5) and causes
  # environment-dependent type errors depending on how pnpm hoists the two
  # versions. Force one version everywhere.
  '@types/express': '^5.0.1'
  js-yaml: '^4.3.1'
  nanoid: '^3.3.17'

  # next@16.2.12 still bundles its own old postcss internally (separate from
  # the patched one Tailwind/Vite already use) — force it to a patched
  # version too. postcss 8.x is backward-compatible within the major.
  postcss: '^8.5.18'
  # next also bundles an old sharp (image optimization) — force the patched line.
  sharp: '^0.35.0'

allowBuilds:
  '@firebase/util': true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# @hookform/resolvers 4.1.3 imports types from "zod" without declaring it. Stryker brings its own zod 4, which pnpm
# then hoisted for the resolver and broke typechecking. Declare the resolver's zod peer so it resolves to the
# zod the app uses (3.x). Scoped to this one package and version; zod itself is not overridden.
packageExtensions:
  '@hookform/resolvers@4.1.3':
    peerDependencies:
      zod: '^3.25.0'
    peerDependenciesMeta:
      zod:
        optional: true
